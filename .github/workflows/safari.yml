name: Check published site in Apple Safari
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish HANDOFF website"]
    types: [completed]
permissions:
  contents: read
jobs:
  safari:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Enable Safari automation on the test runner
        run: sudo safaridriver --enable
      - name: Open the published builder in Mobile Safari
        env:
          HANDOFF_TEST_URL: https://marinanemukhina-lgtm.github.io/handoff/
          DEVICE: ${{ matrix.device }}
        run: python3 tests/browser/safari-simulator.py "$DEVICE"
